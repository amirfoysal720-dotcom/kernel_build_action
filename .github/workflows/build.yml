# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: cyberc3dr/nGKI_Kernel_Build@rebase
        with:
          KERNEL_SOURCE: 'https://github.com/amirfoysal720-dotcom/A15.git'
          KERNEL_SOURCE_BRANCH: 'main'
          KERNEL_CONFIG: 'oppo6765_defconfig'
          ARCH: 'arm64'
          ENABLE_KERNELSU: true
          KERNELSU_TAG: 'next'
          ENABLE_KSU_LKM: false
          ENABLE_KSU_SUSFS: true
