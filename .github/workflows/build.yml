# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/amirfoysal720-dotcom/A15.git
          kernel-dir: kernel-4.9
          kernel-branch: main
          config: oppo6765_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: next
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
